spring:
  application:
    name: tiki-inventory-cacheaside
  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 300000ms # Short TTL 5 minutes for Cache-Aside safety
      cache-null-values: false

server:
  port: 8082

logging:
  level:
    com.example.inventory: DEBUG
    org.springframework.cache: DEBUG
